[project]
name = "pixelle-video-server"
version = "0.1.0"
description = "MCP server for video generation using Playwright automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "playwright>=1.40.0",
]

[project.scripts]
pixelle-video-server = "server:main"

[[mcp.servers]]
name = "pixelle-video-server"
command = "python"
args = ["server.py"]
